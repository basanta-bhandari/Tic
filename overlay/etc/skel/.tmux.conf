set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 50000
set -g status-position top
set -g status-style 'bg=black,fg=colour214'
set -g message-style 'bg=colour214,fg=black,bold'
set -g pane-border-style 'fg=colour58'
set -g pane-active-border-style 'fg=colour214'
set -g status-left ' IMPERIUM  #S '
set -g status-right ' %Y-%m-%d  %H:%M '
setw -g window-status-current-style 'bg=colour214,fg=black,bold'
