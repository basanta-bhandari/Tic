[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_dir_first = true
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 1200
max_height = 1800

[opener]
edit = [{ run = '${EDITOR:-nvim} "$@"', block = true, desc = "Edit" }]
open = [{ run = 'glyph-open "$1"', block = true, desc = "Open in Glyph" }]
