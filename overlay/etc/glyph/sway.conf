# Imperium's transitional Sway adapter mirrors the current COSMIC actions.
set $mod Mod4
set $terminal glyph-kitty

font pango:JetBrainsMono Nerd Font 10
floating_modifier $mod normal
focus_follows_mouse no
default_border pixel 2
default_floating_border pixel 2
gaps inner 4
gaps outer 2

output * bg #101218 solid_color
# Start exactly one wallpaper renderer. `exec_always` leaked another swaybg on
# every config reload and gradually increased memory and composition work.
exec --no-startup-id glyph-wallpaper --sway
exec --no-startup-id mako
exec --no-startup-id $terminal

# COSMIC: launcher, window actions, floating, fullscreen, and overview.
bindsym $mod+r exec imperium launcher
bindsym $mod+w kill
bindsym $mod+Shift+m move scratchpad
bindsym $mod+v floating toggle
bindsym $mod+Shift+f fullscreen toggle
bindsym $mod+Shift+w exec imperium overview
bindsym Mod1+Tab focus next
bindsym Ctrl+Shift+s exec grim -g "$(slurp)" "$HOME/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"

# COSMIC: move the focused surface to workspace 1–9; Alt+0 uses the last one.
bindsym Mod1+1 move container to workspace number 1
bindsym Mod1+2 move container to workspace number 2
bindsym Mod1+3 move container to workspace number 3
bindsym Mod1+4 move container to workspace number 4
bindsym Mod1+5 move container to workspace number 5
bindsym Mod1+6 move container to workspace number 6
bindsym Mod1+7 move container to workspace number 7
bindsym Mod1+8 move container to workspace number 8
bindsym Mod1+9 move container to workspace number 9
bindsym Mod1+0 move container to workspace back_and_forth
bindsym $mod+Shift+comma move container to workspace prev_on_output
bindsym $mod+Shift+period move container to workspace next_on_output

# COSMIC: resizing.
bindsym $mod+Ctrl+y resize grow width 40 px or 4 ppt
bindsym $mod+Ctrl+z resize shrink width 40 px or 4 ppt

# COSMIC: brightness, volume, microphone, media, and suspend.
bindsym $mod+F1 exec brightnessctl set 5%-
bindsym $mod+F2 exec brightnessctl set +5%
bindsym $mod+F3 exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym $mod+F4 exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym $mod+F5 exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym $mod+F6 exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym $mod+F7 exec playerctl next
bindsym $mod+F8 exec playerctl previous
bindsym $mod+space exec playerctl play-pause
bindsym $mod+Mod1+Escape exec systemctl suspend

# Recovery shortcuts deliberately remain available.
bindsym $mod+Return exec $terminal
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit Zenith?' -b 'Exit' 'swaymsg exit'

include /etc/sway/config.d/*
