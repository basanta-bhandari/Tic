# Transitional Imperium uses Kitty as its GPU-rendered terminal surface.
shell fish --login
font_family JetBrainsMono Nerd Font
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

allow_remote_control socket-only
enabled_layouts splits,tall,stack
window_padding_width 4
draw_minimal_borders yes
# Favor immediate key-to-cell response while retaining monitor synchronization.
input_delay 0
repaint_delay 2
sync_to_monitor yes
tab_bar_style separator
tab_separator "  "
tab_title_template {index}: {title}
active_tab_font_style bold
background_opacity 0.96
dynamic_background_opacity yes
confirm_os_window_close 0
remember_window_size no
initial_window_width 1280
initial_window_height 800

include current-theme.conf

map ctrl+shift+enter launch --location=vsplit fish --login
map ctrl+shift+backslash launch --location=hsplit fish --login
map ctrl+shift+t launch --type=tab --tab-title=Workspace fish --login
map ctrl+shift+space launch --type=overlay --title='Zenith Launcher' zenith
map ctrl+shift+o launch --type=overlay --title='Imperium Overview' imperium overview
map ctrl+shift+right neighboring_window right
map ctrl+shift+left neighboring_window left
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
